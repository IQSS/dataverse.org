name: Deploy static site to GitHub Pages

# Builds the vinext app, prerenders every route into a static folder, and publishes it with
# GitHub Pages. Enable Pages once in the repository settings with source "GitHub Actions".
# A push to main goes live in a couple of minutes if the tests pass. Every deploy builds main's code
# with the numbers from daily-metrics, which only the daily metrics job writes, so nobody merges or
# pushes to that branch by hand.
# For a custom domain set the repository variable SITE_BASE_PATH to "/" (and add a CNAME file
# under public/); without it the site is served at https://<owner>.github.io/<repo>/.

on:
  push:
    branches: [main, daily-metrics]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Use the latest numbers
        run: |
          git fetch --depth=1 origin daily-metrics
          git checkout FETCH_HEAD -- data/headline-metrics.json data/headline-metrics.ts data/installation-metrics.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prerender static site
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
        run: node scripts/export-static.mjs --out site-static --base "${SITE_BASE_PATH:-/${GITHUB_REPOSITORY#*/}}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
