<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Dataverse FY27 roadmap</title>
  <desc id="description">July 2026 to June 2027. Target releases: 6.12, September 16, 2026; 6.13, December 16, 2026; 6.14, March 17, 2027; 6.15, June 16, 2027. Six ongoing work themes have no assigned release dates.</desc>
  <rect width="1200" height="620" fill="#fff"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#252525">
    <text x="48" y="47" font-size="16" font-weight="600" fill="#a84a1d" letter-spacing="2">THE DATAVERSE PROJECT</text>
    <text x="48" y="94" font-family="Questrial, Arial, sans-serif" font-size="40" font-weight="600">FY27 roadmap</text>
    <text x="1152" y="92" text-anchor="end" font-size="20">July 2026–June 2027</text>
    <path d="M48 121H1152" stroke="#252525"/>
    <g text-anchor="middle">
      <text x="210" y="161" font-size="20" font-weight="600">Q1</text>
      <text x="470" y="161" font-size="20" font-weight="600">Q2</text>
      <text x="730" y="161" font-size="20" font-weight="600">Q3</text>
      <text x="990" y="161" font-size="20" font-weight="600">Q4</text>
      <g font-size="18" fill="#555">
        <text x="210" y="190">Jul–Sep 2026</text>
        <text x="470" y="190">Oct–Dec 2026</text>
        <text x="730" y="190">Jan–Mar 2027</text>
        <text x="990" y="190">Apr–Jun 2027</text>
      </g>
    </g>
    <path d="M340 143V330 M600 143V330 M860 143V330" stroke="#e8d4c9" stroke-dasharray="4 6"/>
    <path d="M80 236H1120" fill="none" stroke="#c55b28" stroke-width="4"/>
    <g fill="#c55b28" stroke="#fff" stroke-width="3">
      <circle cx="299" cy="236" r="9"/>
      <circle cx="559" cy="236" r="9"/>
      <circle cx="818" cy="236" r="9"/>
      <circle cx="1077" cy="236" r="9"/>
    </g>
    <g text-anchor="middle">
      <g font-size="28" font-weight="600" fill="#c55b28">
        <text x="299" y="282">6.12</text>
        <text x="559" y="282">6.13</text>
        <text x="818" y="282">6.14</text>
        <text x="1077" y="282">6.15</text>
      </g>
      <g font-size="18">
        <text x="299" y="312">Sep 16, 2026</text>
        <text x="559" y="312">Dec 16, 2026</text>
        <text x="818" y="312">Mar 17, 2027</text>
        <text x="1077" y="312">Jun 16, 2027</text>
      </g>
    </g>
    <text x="48" y="354" font-size="16" fill="#555">Software release targets · dates may change</text>
    <rect x="48" y="384" width="1104" height="172" fill="#fff1e9"/>
    <text x="72" y="420" font-size="18" font-weight="600">FY27 PRIORITIES AND ONGOING WORK</text>
    <g font-size="20">
      <text x="72" y="461">Biomedical data sharing</text>
      <text x="444" y="461">Indigenous data support</text>
      <text x="816" y="461">Usability and collections</text>
      <text x="72" y="514">Metadata, AI, and discovery</text>
      <text x="444" y="502">Repository and</text>
      <text x="444" y="527">curation services</text>
      <text x="816" y="514">Community and performance</text>
    </g>
    <text x="48" y="590" font-size="16" fill="#555">Initiative timing is not assigned to specific releases. Follow technical milestones on GitHub.</text>
